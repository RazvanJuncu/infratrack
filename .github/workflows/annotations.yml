name: InfraTrack label intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: read
  actions: write
jobs:
  intake:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[InfraTrack label]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate owner-submitted evidence and annotation
        run: python scripts/ingest_annotation.py
      - name: Commit owner-attested labels
        id: commitlabels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labels/reviewed.jsonl
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: import owner-attested InfraTrack issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger updated validation report
        if: steps.commitlabels.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
