name: InfraTrack — real Sentinel-2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"  # Daily UTC recheck for registered research windows
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: infratrack-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Test browser review, European watchlist and recent training
        run: node --test tests/test_quick_label.cjs tests/test_monitor_ui.cjs
      - name: Resolve mapped corridor and analyze real Sentinel-2
        shell: bash
        run: |
          set +e
          python infratrack.py --lat 44.5065 --lon 26.2328 --size-km 2 --before 2023-06-01/2023-08-31 --after 2025-06-01/2025-08-31 --max-cloud 35 --output site
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Satellite imagery was not available; publishing explicit no-data state"
            python scripts/failure_page.py
          fi
      - name: Generate geographically distributed, unverified review targets
        shell: bash
        run: |
          if [ -f site/features_v05.npz ]; then
            python scripts/build_review_queue.py --per-class 8
          else
            echo '{"status":"unavailable","message":"Real source imagery missing; no candidate points generated","items":[]}' > site/review_queue_v06.json
          fi
      - name: Evaluate owner-sourced labels with site-held-out testing
        shell: bash
        run: |
          if [ -f site/features_v05.npz ]; then
            python scripts/train_validation.py
          else
            echo '{"status":"unavailable","message":"No real four-scene featurepack was generated. No model trained."}' > site/validation_v05.json
          fi
      - name: Process registered motorway study areas
        run: python -m scripts.build_portfolio --config projects/regions.json --output site
      - name: Refresh recent Sentinel-2 views and significant-change review queue
        run: python -m scripts.recent_watch --config projects/regions.json --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
